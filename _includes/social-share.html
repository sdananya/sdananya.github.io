{% include base_path %}
{% assign share_url = base_path | append: page.url %}

<section class="page__share share-min">
  <style>
    .share-min{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
    .share-min__label{font-size:.75em;opacity:.7;margin-right:.3em}
    .share-min button[hidden]{display:none}
    .share-min a,.share-min button{display:inline-flex;align-items:center;justify-content:center;width:2.2em;height:2.2em;border-radius:50%;border:1px solid var(--global-border-color,#bbb);background:none;color:var(--global-text-color,inherit);font-size:.85em;text-decoration:none;cursor:pointer;padding:0;transition:background .15s,color .15s,border-color .15s}
    .share-min a:hover,.share-min button:hover{background:var(--global-text-color,#333);color:var(--global-bg-color,#fff);border-color:var(--global-text-color,#333)}
    .share-min__done{font-size:.75em;opacity:.7}
  </style>
  <span class="share-min__label">Share</span>
  <button type="button" class="share-min__native" hidden title="Share" aria-label="Share"><i class="fas fa-share-nodes" aria-hidden="true"></i></button>
  <button type="button" class="share-min__copy" title="Copy link" aria-label="Copy link"><i class="fas fa-link" aria-hidden="true"></i></button>
  <span class="share-min__done" aria-live="polite"></span>
  <script>
  (function(){
    var box=document.currentScript.parentNode,url={{ share_url | jsonify }},title={{ page.title | jsonify }};
    var nat=box.querySelector('.share-min__native'),copy=box.querySelector('.share-min__copy'),msg=box.querySelector('.share-min__done');
    if(navigator.share){nat.hidden=false;nat.addEventListener('click',function(){navigator.share({title:title,url:url}).catch(function(){})})}
    copy.addEventListener('click',function(){navigator.clipboard.writeText(url).then(function(){msg.textContent='Link copied';setTimeout(function(){msg.textContent=''},1800)})});
  })();
  </script>
</section>
