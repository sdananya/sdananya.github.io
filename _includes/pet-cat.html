<div class="pet-cat" id="pet-cat">
<style>
.pet-cat{position:relative;width:440px;max-width:100%;margin:1.5em 0 0;color:var(--global-text-color,#222);user-select:none;-webkit-user-select:none}
.pet-cat svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.pet-cat .pc-cat{cursor:grab;transform-box:fill-box;transform-origin:50% 100%}
.pet-cat .pc-ink{fill:none;stroke:currentColor;stroke-width:5.5;stroke-linejoin:round;stroke-linecap:round;filter:url(#pc-rough)}
.pet-cat .pc-ink2{stroke-width:3;filter:url(#pc-rough2)}
.pet-cat .pc-paper{fill:var(--global-bg-color,#fff);stroke:none}
.pet-cat .pc-band{fill:none;stroke-linecap:round;filter:url(#pc-rough)}
.pet-cat .pc-paperline{stroke:var(--global-bg-color,#fff)}
.pet-cat .pc-tail{transform-box:fill-box;transform-origin:0% 100%;animation:pc-swish 3.2s ease-in-out infinite}
.pet-cat .pc-eye{transform-box:fill-box;transform-origin:center;animation:pc-blink 5.5s infinite}
.pet-cat .pc-cat.purring{animation:pc-wiggle .32s ease-in-out infinite}
.pet-cat .purring .pc-eye{animation:none;transform:scaleY(.12)}
.pet-cat .purring .pc-tail{animation-duration:.9s}
.pet-cat .pc-count{font-size:.7em;opacity:.65;margin:.2em 0 0 .4em;min-height:1.4em}
.pet-cat .pc-heart{position:absolute;pointer-events:none;line-height:0;animation:pc-float 1.3s ease-out forwards}
@keyframes pc-swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes pc-blink{0%,92%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.1)}}
@keyframes pc-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
@keyframes pc-float{0%{opacity:0;transform:translate(-50%,0) rotate(var(--r)) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-60px) rotate(var(--r)) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.pet-cat .pc-tail,.pet-cat .pc-eye,.pet-cat .pc-cat.purring{animation:none}}
</style>
<svg viewBox="100 315 690 365" role="img" aria-label="A striped cat and a kitten, drawn by Ananya. Stroke them to pet them." tabindex="0">
<defs>
<pattern id="pc-lines" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-7)"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.6"/></pattern>
<pattern id="pc-bars" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><line x1="4.5" y1="0" x2="4.5" y2="9" stroke="currentColor" stroke-width="1.6"/></pattern>
<pattern id="pc-grid" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)"><path d="M0 4.5H9M4.5 0V9" stroke="currentColor" stroke-width="1.3" fill="none"/></pattern>
<filter id="pc-rough" filterUnits="userSpaceOnUse" x="50" y="250" width="800" height="500"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="pc-rough2" filterUnits="userSpaceOnUse" x="50" y="250" width="800" height="500"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="G" yChannelSelector="R"/></filter>
<filter id="pc-hrough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs>

<g class="pc-eye"><circle cx="410" cy="390" r="11" fill="#e0b21c" stroke="currentColor" stroke-width="2.4"/><circle class="pc-pupil" data-k="1" cx="410" cy="390" r="5.5" fill="#222"/></g>

<g class="pc-eye"><circle cx="449" cy="503" r="6.5" fill="#e0b21c" stroke="currentColor" stroke-width="1.3"/><circle class="pc-pupil" data-k="0.55" cx="449" cy="503" r="3.2" fill="#222"/></g>
</g>

<div class="pc-count" aria-live="polite"></div>
<script>
(function(){
var box=document.getElementById('pet-cat');if(!box)return;
var svg=box.querySelector('svg'),pupils=box.querySelectorAll('.pc-pupil'),label=box.querySelector('.pc-count');
var HEARTS=['<path fill="currentColor" fill-rule="evenodd" d="M12 21 C5.5 15.5 2.2 11.5 3.2 7.2 C4.3 3.2 9.4 2.8 12 7.4 C14.4 2.6 20 3 21 7 C22 11.4 17.6 15.8 12 21 Z M12.6 17.6 C8.6 14 6.4 11.2 7 8.4 C7.7 6 10.6 6.2 12.4 9.6 C14 6.4 17.8 5.6 18.6 8 C19.4 10.6 16.4 14 12.6 17.6 Z"/>', '<path fill="currentColor" d="M12 21 C5.5 15.5 2.2 11.5 3.2 7.2 C4.3 3.2 9.4 2.8 12 7.4 C14.4 2.6 20 3 21 7 C22 11.4 17.6 15.8 12 21 Z"/><path fill="none" stroke="var(--global-bg-color,#fff)" stroke-width="1.3" stroke-linecap="round" d="M6.2 9.6 C6 7.6 7 6.2 8.6 5.9"/>', '<path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12.4 20.6 C6 15.6 2.6 11.4 3.8 7.2 C5 3.6 9.8 3.4 12 7.8 C14.2 3 19.8 3.2 20.8 7.2 C21.6 11.2 17 15.6 11.4 21.2"/><path fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" d="M11.2 19 C6.6 15 4.6 11.6 5.4 8.4 C6.2 5.6 9.8 5.4 11.6 9.4 M13 8.6 C14.8 5.4 18.6 5.2 19.4 8 C20 10.8 17 14.4 13.4 17.8"/>', '<path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 21 C5.5 15.5 2.2 11.5 3.2 7.2 C4.3 3.2 9.4 2.8 12 7.4 C14.4 2.6 20 3 21 7 C22 11.4 17.6 15.8 12 21 Z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M5 8.2 L10.6 7.4 M13.6 7.2 L19.6 6.6 M4.6 11.2 L20 9.8 M7 14.2 L18 13 M9.8 17 L15.2 16.4"/>'];
var KEY='petCatCount',count=0,dist=0,last=null;
try{count=parseInt(localStorage.getItem(KEY),10)||0}catch(e){}
function show(){label.textContent=count?('You have petted the cats '+count+(count===1?' time':' times')):'Stroke the cats to pet them'}
function heart(x,y){var h=document.createElement('span');h.className='pc-heart';
h.innerHTML='<svg viewBox="0 0 24 24" width="100%" height="100%" overflow="visible"><g filter="url(#pc-hrough)">'+HEARTS[Math.floor(Math.random()*HEARTS.length)]+'</g></svg>';
var sz=20+Math.random()*14;h.style.width=h.style.height=sz+'px';h.style.left=x+'px';h.style.top=y+'px';h.style.setProperty('--r',(Math.random()*40-20).toFixed(0)+'deg');h.style.setProperty('--dx',(Math.random()*30-15).toFixed(0)+'px');
box.appendChild(h);h.addEventListener('animationend',function(){h.remove()})}
function purr(c){if(!c)return;c.classList.add('purring');clearTimeout(c._t);c._t=setTimeout(function(){c.classList.remove('purring')},700)}
function pet(c,x,y){count++;try{localStorage.setItem(KEY,count)}catch(e){}show();heart(x,y);purr(c)}
function local(e){var r=box.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function catAt(e){return e.target.closest?e.target.closest('.pc-cat'):null}
svg.addEventListener('pointermove',function(e){var c=catAt(e);if(!c){last=null;return}var p=local(e);if(last){dist+=Math.abs(p.x-last.x)+Math.abs(p.y-last.y);purr(c)}last=p;if(dist>90){dist=0;pet(c,p.x,p.y-10)}});
svg.addEventListener('pointerleave',function(){last=null});
svg.addEventListener('click',function(e){var c=catAt(e);if(!c)return;var p=local(e);pet(c,p.x,p.y-10)});
svg.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pet(box.querySelector('.pc-cat'),box.offsetWidth*.4,20)}});
document.addEventListener('pointermove',function(e){for(var i=0;i<pupils.length;i++){var q=pupils[i],r=q.parentNode.getBoundingClientRect(),k=+q.dataset.k,
dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.sqrt(dx*dx+dy*dy)||1,m=Math.min(4.5,d/30)*k;
q.setAttribute('transform','translate('+(dx/d*m).toFixed(2)+' '+(dy/d*m).toFixed(2)+')')}});
show();
})();
</script>
</div>
